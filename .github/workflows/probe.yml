name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: collect
        run: |
          mkdir -p /tmp/p; UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          curl -sS -m 30 -A "$UA" "https://vancouver.craigslist.org/van/apa/d/vancouver-one-small-private-bedroom-in/7983248505.html" -o /tmp/p/d1.html -w "html %{http_code}\n"
          curl -sS -m 30 -A "$UA" "https://vancouver.craigslist.org/van/apa/7983248505.html" -o /tmp/p/d2.html -w "html2 %{http_code}\n"
          curl -sS -m 30 -A "$UA" "https://sapi.craigslist.org/web/v8/postings/8A7R8ueFHPpHv9xDH1a9yn?lang=en&cc=US" -o /tmp/p/s1.json -w "s1 %{http_code}\n"
          curl -sS -m 30 -A "$UA" "https://sapi.craigslist.org/web/v8/postings/7983248505?lang=en&cc=US" -o /tmp/p/s2.json -w "s2 %{http_code}\n"
          curl -sS -m 30 -A "$UA" "https://sapi.craigslist.org/web/v8/postings/full/8A7R8ueFHPpHv9xDH1a9yn?lang=en&cc=US" -o /tmp/p/s3.json -w "s3 %{http_code}\n"
          curl -sS -m 30 -A "$UA" "https://images.craigslist.org/00K0K_ehjzZBYku6M_0js0pX_600x450.jpg" -o /tmp/p/img.jpg -w "img %{http_code} %{size_download}\n"
          ls -la /tmp/p; head -c 400 /tmp/p/s1.json; echo; head -c 400 /tmp/p/s2.json; echo; head -c 400 /tmp/p/s3.json
          git config user.name probe; git config user.email probe@x
          git checkout -q --orphan probe-data2; git rm -rfq . ; cp -r /tmp/p/* .; git add -A; git commit -qm probe; git push -f origin probe-data2
