* { box-sizing: border-box; }

.vsep { flex: none; width: 1px; height: 24px; background: var(--line); }

.deck { display: grid; }
.profile { display: grid; gap: 12px; touch-action: pan-y; user-select: none; -webkit-user-select: none; transform-origin: 50% 20%; will-change: transform; }
.deck .profile { cursor: grab; }

.pbox { position: relative; border-radius: 16px; overflow: hidden; background: var(--fill); }
.pimg { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--fill); -webkit-user-drag: none; }
.pimg.none { display: grid; place-items: center; font-size: 14px; color: var(--muted); }
.pager { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 2; display: flex; gap: 4px; pointer-events: none; }
.pager i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.5); box-shadow: 0 0 3px rgba(0, 0, 0, 0.35); }
.pager i.on { background: rgba(255, 255, 255, 0.96); }
.pcount { position: absolute; right: 10px; bottom: 10px; z-index: 2; padding: 0 10px; border-radius: 999px; background: rgba(0, 0, 0, 0.55); color: #ffffff; font-family: var(--font-mono); font-size: 12px; line-height: 22px; pointer-events: none; }
.pnav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, 0.45); color: #ffffff; display: none; place-items: center; padding: 0; cursor: pointer; }
.pnav.prev { left: 8px; }
.pnav.next { right: 8px; }
.pnav[hidden] { display: none !important; }
.pnav:focus-visible { display: grid; }
@media (hover: hover) and (pointer: fine) { .pbox:hover .pnav:not([hidden]) { display: grid; } }

.vitals { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.vhead { padding: 16px; }
.vhead .title { margin: 0; font-size: 18px; line-height: 24px; font-weight: 500; text-wrap: balance; }
.vhead .addr { margin: 4px 0 0; font-size: 14px; line-height: 20px; color: var(--muted); }
.vtop { display: flex; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--line); }
.vtop::-webkit-scrollbar { display: none; }
.vcell { flex: none; display: flex; align-items: center; gap: 12px; padding: 16px; font-size: 15px; white-space: nowrap; border-right: 1px solid var(--line); }
.vcell:last-child { border-right: 0; }
.vrow { display: flex; align-items: center; gap: 12px; padding: 16px; border-top: 1px solid var(--line); font-size: 15px; line-height: 22px; }
.vico { flex: none; width: 24px; height: 24px; display: grid; place-items: center; color: var(--ink); }
.vico svg { width: 24px; height: 24px; }
.vtext { min-width: 0; }
.avail { display: inline-flex; align-items: center; gap: 8px; }
.avail::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.avail.unknown { color: var(--muted); }
.avail.unknown::before { background: transparent; border: 1.5px solid var(--muted); }
.vnote { margin: 0; padding: 16px; border-top: 1px solid var(--line); font-size: 15px; line-height: 24px; color: var(--ink2); }
.vfoot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13px; line-height: 20px; color: var(--muted); }
.openlink { color: var(--accent); font-weight: 500; text-decoration: none; }
.openlink:hover { text-decoration: underline; }
.vfoot .openlink { min-height: 44px; display: inline-flex; align-items: center; }

.mapsec { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 8px; }
.subhead { margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--ink2); }
.note { margin: 0; font-size: 13px; line-height: 20px; color: var(--muted); }
.map { position: relative; z-index: 0; height: 260px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.map.leaflet-container { background: var(--bg); font: inherit; }
.leaflet-container a { color: var(--accent); }
.leaflet-container .leaflet-control-attribution { font-size: 11px; line-height: 16px; }

.actions { position: fixed; left: 0; right: 0; bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 10; display: flex; justify-content: center; align-items: center; gap: 24px; pointer-events: none; }
.actions[hidden] { display: none; }
.ctl { font: inherit; font-size: 16px; font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; pointer-events: auto; }
.ctl:hover { border-color: var(--accent); }
.ctl:disabled { opacity: 0.4; cursor: default; }
.ctl.undo:disabled { opacity: 0; pointer-events: none; }
.ctl.no, .ctl.yes { width: 64px; height: 64px; border-radius: 50%; display: inline-grid; place-items: center; padding: 0; box-shadow: var(--shadow); }
.ctl.no { color: var(--ink2); }
.ctl.yes { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ctl.undo { width: 44px; height: 44px; border-radius: 50%; display: inline-grid; place-items: center; padding: 0; color: var(--muted); box-shadow: var(--shadow); }
.ctl.show { width: 100%; height: 52px; border-radius: 12px; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ctl.wide { height: 48px; padding: 0 20px; border-radius: 12px; }
.ctl.wide.fill { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom)); width: min(448px, calc(100% - 32px)); z-index: 12; display: flex; gap: 4px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 32px; box-shadow: var(--shadow); }
.tab { flex: 1; position: relative; display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 56px; padding: 6px 4px; border: 0; border-radius: 26px; background: none; color: var(--ink); font: inherit; font-size: 12px; line-height: 16px; cursor: pointer; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { background: var(--fill); }
.tbadge { position: absolute; top: 4px; left: calc(50% + 4px); min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-size: 12px; line-height: 20px; text-align: center; }
.tbadge[hidden] { display: none; }

.list { display: grid; gap: 12px; }
.row2 { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; align-items: start; cursor: pointer; }
.thumb { width: 96px; height: 72px; object-fit: cover; border-radius: 10px; display: block; background: var(--fill); }
.thumb.none { display: grid; place-items: center; font-size: 12px; color: var(--muted); text-align: center; }
.rt { min-width: 0; }
.rp { font-family: var(--font-mono); font-size: 16px; line-height: 24px; font-weight: 500; }
.rn { font-size: 14px; line-height: 20px; }
.rm { font-size: 13px; line-height: 20px; color: var(--muted); }
.acts { grid-column: 1 / -1; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
.linkbtn { font: inherit; font-size: 14px; font-weight: 500; background: none; color: var(--ink2); border: 0; min-height: 44px; padding: 0 12px; cursor: pointer; }
.linkbtn:hover { color: var(--ink); text-decoration: underline; }
.empty { padding: 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; }
.viewhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0 12px; }

.stampfix { position: fixed; top: 120px; z-index: 30; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid; opacity: 0; pointer-events: none; }
.stampfix.yes { right: 24px; color: var(--accent); }
.stampfix.no { left: 24px; color: var(--ink); }

.detail { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; }
.detail[hidden] { display: none; }
.detailbar { display: flex; align-items: center; justify-content: space-between; padding: max(8px, env(safe-area-inset-top)) 8px 8px; border-bottom: 1px solid var(--line); background: var(--bg); }
.detailscroll { flex: 1; overflow-y: auto; padding: 12px 16px 24px; }
.detailscroll .profile { max-width: 480px; margin: 0 auto; }
.detailacts { display: flex; justify-content: center; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); }

.sheet { position: fixed; inset: 0; z-index: 40; background: rgba(8, 10, 12, 0.55); display: grid; place-items: end center; }
.sheet[hidden] { display: none; }
.sheet-body { position: relative; background: var(--surface); color: var(--ink); width: 100%; max-width: 480px; max-height: 92dvh; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px; display: grid; gap: 12px; align-content: start; }
@media (min-width: 721px) { .sheet { place-items: center; } .sheet-body { border-radius: 16px; } }
.sheethead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheettitle { margin: 0; font-size: 20px; line-height: 28px; font-weight: 500; }
.sheetacts { display: flex; align-items: center; gap: 8px; }
.closebtn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-height: 44px; padding: 0 16px; font: inherit; font-size: 14px; font-weight: 500; color: var(--ink); cursor: pointer; }
.group { display: grid; gap: 8px; align-items: start; }
.group .lbl { font-size: 13px; line-height: 20px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 14px; line-height: 20px; min-height: 40px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink2); cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sortlabel { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
select { font: inherit; font-size: 16px; min-height: 44px; width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.sheet-body > .controls { position: sticky; bottom: 0; margin: 0 -16px -16px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); }
.controls { display: flex; justify-content: center; gap: 12px; }
@media (prefers-reduced-motion: no-preference) { .chip, .bubble, .tab, .filterbtn, .langbtn { transition: background-color 0.12s, border-color 0.12s, color 0.12s; } }

</style>
</head>
<body>

<div class="wrap">
  <div id="viewDiscover">
    <div class="topbar">
      <button type="button" class="filterbtn" id="filterBtn" aria-haspopup="dialog">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        <span data-i18n="filters">Filters</span>
        <span class="badge" id="filterBadge" hidden></span>
      </button>
      <div class="bubbles" id="bubbles" role="group" aria-label="Quick filters"></div>
      <button type="button" class="langbtn" data-lang-toggle></button>
    </div>
    <div class="headrow">
      <h1 id="greeting">Good evening</h1>
      <span id="count" aria-live="polite"></span>
    </div>
    <p class="asof" id="asOf"></p>
    <div class="deck" id="deck"></div>
  </div>

  <div id="viewSaved" hidden>
    <div class="viewhead"><h2><span data-i18n="tab.saved">Saved</span> <span id="savedCount"></span></h2><button type="button" class="langbtn" data-lang-toggle></button></div>
    <div class="list" id="savedList"></div>
  </div>

  <div id="viewEmailed" hidden>
    <div class="viewhead"><h2><span data-i18n="tab.emailed">Emailed</span> <span id="emailedCount"></span></h2><button type="button" class="langbtn" data-lang-toggle></button></div>
    <div class="list" id="emailedList"></div>
  </div>

  <div id="viewArchive" hidden>
    <div class="viewhead"><h2><span data-i18n="tab.archive">Archive</span> <span id="archiveCount"></span></h2><button type="button" class="langbtn" data-lang-toggle></button></div>
    <div class="list" id="archiveList"></div>
  </div>
</div>

<div class="actions" id="actions">
  <button type="button" class="ctl no" id="btnNo"></button>
  <button type="button" class="ctl undo" id="btnUndo"></button>
  <button type="button" class="ctl yes" id="btnYes"></button>
</div>

<nav class="tabbar" id="tabbar" aria-label="Sections">
  <button type="button" class="tab" id="tabDiscover" aria-current="page"><span class="ti" data-icon="layers"></span><span data-i18n="tab.discover">Discover</span></button>
  <button type="button" class="tab" id="tabSaved" aria-current="false"><span class="ti" data-icon="heartline"></span><span data-i18n="tab.saved">Saved</span><span class="tbadge" id="savedBadge" hidden></span></button>
  <button type="button" class="tab" id="tabEmailed" aria-current="false"><span class="ti" data-icon="mail"></span><span data-i18n="tab.emailed">Emailed</span></button>
  <button type="button" class="tab" id="tabArchive" aria-current="false"><span class="ti" data-icon="archive"></span><span data-i18n="tab.archive">Archive</span></button>
</nav>

<span class="stampfix yes" id="stampYes" aria-hidden="true"></span>
<span class="stampfix no" id="stampNo" aria-hidden="true"></span>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-label="Listing" hidden>
  <div class="detailbar">
    <button type="button" class="linkbtn" id="detailBack" data-i18n="back">Back</button>
    <button type="button" class="langbtn" data-lang-toggle></button>
  </div>
  <div class="detailscroll" id="detailBody"></div>
  <div class="detailacts" id="detailActs"></div>
</div>

<div class="sheet" id="filterSheet" role="dialog" aria-modal="true" aria-label="Filters" hidden>
  <div class="sheet-body">
    <div class="sheethead">
      <h2 class="sheettitle" data-i18n="filters">Filters</h2>
      <div class="sheetacts">
        <button type="button" class="linkbtn" id="filterReset" data-i18n="reset">Reset</button>
        <button type="button" class="closebtn" id="filterClose" data-i18n="close">Close</button>
      </div>
    </div>
    <div class="group" id="g-loc"><span class="lbl" data-i18n="loc">Location</span></div>
    <div class="group" id="g-tier"><span class="lbl" data-i18n="price">Price</span></div>
    <div class="group" id="g-kind"><span class="lbl" data-i18n="type">Type</span></div>
    <div class="group" id="g-stay"><span class="lbl" data-i18n="stayLen">Stay length</span></div>
    <div class="group" id="g-src"><span class="lbl" data-i18n="source">Source</span></div>
    <label class="sortlabel"><span data-i18n="sortBy">Sort by</span>
      <select id="sort">
        <option value="match" data-i18n="sort.match">Best match: apartments, downtown, then price</option>
        <option value="price" data-i18n="sort.price">Price, low to high</option>
        <option value="avail" data-i18n="sort.avail">Availability, soonest first</option>
      </select>
    </label>
    <div class="controls"><button type="button" class="ctl show" id="filterShow"></button></div>
  </div>
</div>

// One photo box. Tap the right half for the next photo and the left half for the previous one.
function carouselEl(l) {
  var pics = PHOTOS[l.id] || [];
  var box = el("div", "pbox");
  if (!pics.length) {
    box.appendChild(el("div", "pimg none", t("noPhotoListing")));
    return box;
  }
  var img = el("img", "pimg");
  img.width = 420;
  img.height = 315;
  img.draggable = false;
  box.appendChild(img);
  var idx = 0;
  var bars = null, count = null, prev = null, next = null;
  if (pics.length > 1) {
    bars = el("div", "pager");
    bars.setAttribute("aria-hidden", "true");
    for (var i = 0; i < pics.length; i++) bars.appendChild(el("i"));
    box.appendChild(bars);
    count = el("span", "pcount");
    count.setAttribute("aria-hidden", "true");
    box.appendChild(count);
    prev = el("button", "pnav prev");
    prev.type = "button";
    prev.innerHTML = ICONS.chevL;
    prev.setAttribute("aria-label", t("prevPhoto"));
    next = el("button", "pnav next");
    next.type = "button";
    next.innerHTML = ICONS.chevR;
    next.setAttribute("aria-label", t("nextPhoto"));
    box.appendChild(prev);
    box.appendChild(next);
  }
  function show(n) {
    idx = Math.max(0, Math.min(pics.length - 1, n));
    img.src = pics[idx];
    img.alt = t("photoOf", idx + 1, pics.length, LT(l, "title"));
    if (bars) {
      Array.prototype.forEach.call(bars.children, function (b, k) { b.className = k === idx ? "on" : ""; });
      count.textContent = (idx + 1) + "/" + pics.length;
      prev.hidden = idx === 0;
      next.hidden = idx === pics.length - 1;
    }
  }
  var lastTap = 0;
  box.tap = function (clientX) {
    var now = Date.now();
    if (now - lastTap < 60) return;
    lastTap = now;
    var r = box.getBoundingClientRect();
    show(clientX < r.left + r.width / 2 ? idx - 1 : idx + 1);
  };
  box.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest(".pnav")) return;
    box.tap(e.clientX);
  });
  if (prev) {
    prev.addEventListener("click", function (e) { e.stopPropagation(); show(idx - 1); });
    next.addEventListener("click", function (e) { e.stopPropagation(); show(idx + 1); });
  }
  show(0);
  return box;
}

function vrow(icon, content) {
  var r = el("div", "vrow");
  r.appendChild(iconSpan("vico", icon));
  var tx = el("span", "vtext");
  if (typeof content === "string") { tx.textContent = content; } else { tx.appendChild(content); }
  r.appendChild(tx);
  return r;
}

function vitalsEl(l) {
  var box = el("section", "vitals");
  var head = el("div", "vhead");
  head.appendChild(el("h3", "title", LT(l, "title")));
  head.appendChild(el("p", "addr", LT(l, "addr")));
  box.appendChild(head);

  var top = el("div", "vtop");
  [["tag", fmt(l.price) + (l.from ? t("andUp") : "")], ["home", t("kind." + l.kind)], ["pin", t("area." + l.area)]].forEach(function (it) {
    var cell = el("div", "vcell");
    cell.appendChild(iconSpan("vico", it[0]));
    cell.appendChild(el("span", "", it[1]));
    top.appendChild(cell);
  });
  box.appendChild(top);

  box.appendChild(vrow("calendar", el("span", "avail " + (l.availKnown ? "known" : "unknown"), LT(l, "avail"))));
  var stayNote = LT(l, "stayNote");
  box.appendChild(vrow("clock", t("stayLabel") + t("stay." + l.stay) + (stayNote ? " · " + stayNote : "")));
  box.appendChild(vrow("drop", LT(l, "bath")));
  box.appendChild(vrow("listed", t("listedLabel") + fmtListed(l.listed)));
  var note = LT(l, "note");
  if (note) box.appendChild(el("p", "vnote", note));

  var foot = el("div", "vfoot");
  foot.appendChild(el("span", "", l.src));
  var a = el("a", "openlink", t("openListing"));
  a.href = l.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  foot.appendChild(a);
  box.appendChild(foot);
  return box;
}

// Order: one photo box (tap to flip through up to 6 photos), the details box, then the map.
function profileEl(l) {
  var node = el("article", "profile");
  node.appendChild(carouselEl(l));
  node.appendChild(vitalsEl(l));

  var out = { node: node, mapEl: null, loc: LOCS[l.id], fail: null };
  if (out.loc && window.L) {
    var sec = el("section", "mapsec");
    sec.appendChild(el("h3", "subhead", t("mapTitle")));
    out.mapEl = el("div", "map");
    sec.appendChild(out.mapEl);
    out.fail = el("p", "note", t("mapFail"));
    out.fail.hidden = true;
    sec.appendChild(out.fail);
    sec.appendChild(el("p", "note", t("mapNote")));
    var gm = el("a", "openlink", t("mapLink"));
    gm.href = "https://www.google.com/maps/search/?api=1&query=" + out.loc.lat + "," + out.loc.lng;
    gm.target = "_blank";
    gm.rel = "noopener noreferrer";
    sec.appendChild(gm);
    node.appendChild(sec);
  }
  return out;
}

function decide(l, v, node) {
  if (busy) return;
  busy = true;
  function finish() {
    decisions[l.id] = v;
    undoStack.push(l.id);
    saveDecisions();
    busy = false;
    shownId = null;
    window.scrollTo(0, 0);
    render();
  }
  if (node && !calm) {
    node.style.transition = "transform 0.22s ease, opacity 0.22s ease";
    node.style.transform = "translate(" + (v === "yes" ? 700 : -700) + "px, 0) rotate(" + (v === "yes" ? 14 : -14) + "deg)";
    node.style.opacity = "0";
    setTimeout(finish, 200);
  } else {
    finish();
  }
}

function undo() {
  var id = undoStack.pop();
  if (!id) return;
  delete decisions[id];
  saveDecisions();
  shownId = null;
  window.scrollTo(0, 0);
  render();
}

function attach(node, l) {
  var startX = 0, startY = 0, dx = 0, dragging = false, moved = false, startTarget = null;
  var yes = document.getElementById("stampYes");
  var no = document.getElementById("stampNo");
  function reset() {
    node.style.transition = "transform 0.2s ease";
    node.style.transform = "";
    yes.style.opacity = 0;
    no.style.opacity = 0;
  }
  node.addEventListener("pointerdown", function (e) {
    if (busy || e.target.closest(".map, a, button")) return;
    dragging = true; moved = false; dx = 0;
    startTarget = e.target;
    startX = e.clientX; startY = e.clientY;
    try { node.setPointerCapture(e.pointerId); } catch (err) {}
    node.style.transition = "none";
  });
  node.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    dx = e.clientX - startX;
    var dy = e.clientY - startY;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    node.style.transform = "translate(" + dx + "px, 0) rotate(" + (dx / 40) + "deg)";
    yes.style.opacity = Math.max(0, Math.min(1, dx / 100));
    no.style.opacity = Math.max(0, Math.min(1, -dx / 100));
  });
  node.addEventListener("pointerup", function (e) {
    if (!dragging) return;
    dragging = false;
    if (Math.abs(dx) > 110) {
      yes.style.opacity = 0; no.style.opacity = 0;
      decide(l, dx > 0 ? "yes" : "no", node);
    } else {
      reset();
      // A tap on the photo box flips the photo.
      if (!moved && startTarget && startTarget.closest && startTarget.closest(".pbox")) {
        var box = node.querySelector(".pbox");
        if (box && box.tap) box.tap(e.clientX);
      }
    }
  });
  node.addEventListener("pointercancel", function () { dragging = false; reset(); });
}

function renderDeck() {
  var deck = document.getElementById("deck");
  if (queue[0] && queue[0].id === shownId && deck.firstChild) return;
  deckMap = destroyMap(deckMap);
  deck.textContent = "";
  shownId = null;
  if (!queue.length) {
    var remaining = ALL.filter(function (l) { return !decisions[l.id]; }).length;
    deck.appendChild(el("div", "empty", remaining ? t("noMatch") : t("caughtUp")));
    return;
  }
  var built = profileEl(queue[0]);
  deck.appendChild(built.node);
  attach(built.node, queue[0]);
  if (built.mapEl) deckMap = mountMap(built.mapEl, built.loc, built.fail);
  shownId = queue[0].id;
}

function rowEl(l, mode) {
  var r = el("article", "row2");
  r.tabIndex = 0;
  r.setAttribute("role", "button");
  r.setAttribute("aria-label", t("rowAria", LT(l, "title"), fmt(l.price)));
  var pics = PHOTOS[l.id] || [];
  if (pics.length) {
    var im = el("img", "thumb");
    im.src = pics[0];
    im.alt = "";
    im.width = 96;
    im.height = 72;
    r.appendChild(im);
  } else {
    r.appendChild(el("div", "thumb none", t("noPhoto")));
  }
  var tx = el("div", "rt");
  tx.appendChild(el("div", "rp", fmt(l.price)));
  tx.appendChild(el("div", "rn", LT(l, "title")));
  tx.appendChild(el("div", "rm", LT(l, "addr")));
  tx.appendChild(el("div", "rm", LT(l, "avail")));
  tx.appendChild(el("div", "rm", t("listedLabel") + fmtListed(l.listed)));
  r.appendChild(tx);
  var acts = el("div", "acts");
  function rowBtn(label, val) {
    var b = el("button", "linkbtn", label);
    b.type = "button";
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      if (val) { decisions[l.id] = val; } else { delete decisions[l.id]; }
      saveDecisions();
      shownId = null;
      render();
    });
    acts.appendChild(b);
  }
  if (mode === "yes") { rowBtn(t("markEmailed"), "mail"); rowBtn(t("remove"), null); }
  else if (mode === "mail") { rowBtn(t("backToSaved"), "yes"); rowBtn(t("remove"), null); }
  else { rowBtn(t("restore"), null); }
  r.appendChild(acts);
  r.addEventListener("click", function () { openDetail(l, mode); });
  r.addEventListener("keydown", function (e) {
    if (e.target === r && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openDetail(l, mode); }
  });
  return r;
}

function fillList(id, list, mode, emptyText) {
  var host = document.getElementById(id);
  host.textContent = "";
  if (!list.length) host.appendChild(el("div", "empty", emptyText));
  list.forEach(function (l) { host.appendChild(rowEl(l, mode)); });
}

function openDetail(l, mode) {
  detailFor = l;
  detailMode = mode;
  lastFocus = document.activeElement;
  detailMap = destroyMap(detailMap);
  var body = document.getElementById("detailBody");
  body.textContent = "";
  var built = profileEl(l);
  body.appendChild(built.node);
  var acts = document.getElementById("detailActs");
  acts.textContent = "";
  function leave(newDecision) {
    if (newDecision) { decisions[l.id] = newDecision; } else { delete decisions[l.id]; }
    saveDecisions();
    shownId = null;
    closeDetail();
    render();
  }
  if (mode === "yes") {
    var rm = el("button", "ctl wide", t("removeSaved"));
    rm.type = "button";
    rm.addEventListener("click", function () { leave(null); });
    var em = el("button", "ctl wide fill", t("markEmailedLong"));
    em.type = "button";
    em.addEventListener("click", function () { leave("mail"); });
    acts.appendChild(rm);
    acts.appendChild(em);
  } else if (mode === "mail") {
    var rm2 = el("button", "ctl wide", t("removeSaved"));
    rm2.type = "button";
    rm2.addEventListener("click", function () { leave(null); });
    var bk = el("button", "ctl wide fill", t("backToSaved"));
    bk.type = "button";
    bk.addEventListener("click", function () { leave("yes"); });
    acts.appendChild(rm2);
    acts.appendChild(bk);
  } else {
    var rs = el("button", "ctl wide", t("restore"));
    rs.type = "button";
    rs.addEventListener("click", function () { leave(null); });
    var lk = el("button", "ctl wide fill", t("saveInstead"));
    lk.type = "button";
    lk.addEventListener("click", function () { leave("yes"); });
    acts.appendChild(rs);
    acts.appendChild(lk);
  }
  document.getElementById("detail").hidden = false;
  document.body.style.overflow = "hidden";
  document.getElementById("detailBody").scrollTop = 0;
  if (built.mapEl) detailMap = mountMap(built.mapEl, built.loc, built.fail);
  document.getElementById("detailBack").focus();
}

function closeDetail() {
  if (!detailFor) return;
  detailFor = null;
  detailMode = null;
  detailMap = destroyMap(detailMap);
  document.getElementById("detail").hidden = true;
  document.body.style.overflow = "";
  if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
}

function setView(v) {
  view = v;
  ["discover", "saved", "emailed", "archive"].forEach(function (n) {
    document.getElementById("view" + cap(n)).hidden = n !== v;
    document.getElementById("tab" + cap(n)).setAttribute("aria-current", n === v ? "page" : "false");
  });
  window.scrollTo(0, 0);
  render();
}

function render() {
  var q = ALL.filter(function (l) {
    return !decisions[l.id] && (state.kind === "all" || l.kind === state.kind) && (state.stay === "all" || l.stay === state.stay) && (!Object.keys(state.tier).length || state.tier[tier(l.price)]) && (!Object.keys(state.loc).length || state.loc[l.area]) && (state.src === "all" || l.src === state.src);
  });
  q.sort(function (a, b) {
    if (state.sort === "avail") return (a.availSort - b.availSort) || (a.price - b.price);
    if (state.sort === "match") return (rank(a) - rank(b)) || (a.price - b.price);
    return a.price - b.price;
  });
  queue = q;

  if (view === "discover") renderDeck();
  document.getElementById("count").textContent = t("count", q.length);
  document.getElementById("filterShow").textContent = t("show", q.length);

  var saved = ALL.filter(function (l) { return decisions[l.id] === "yes"; }).sort(function (a, b) { return a.price - b.price; });
  var archived = ALL.filter(function (l) { return decisions[l.id] === "no"; }).sort(function (a, b) { return a.price - b.price; });
  fillList("savedList", saved, "yes", t("empty.saved"));
  var emailed = ALL.filter(function (l) { return decisions[l.id] === "mail"; }).sort(function (a, b) { return a.price - b.price; });
  fillList("emailedList", emailed, "mail", t("empty.emailed"));
  document.getElementById("emailedCount").textContent = emailed.length ? "(" + emailed.length + ")" : "";
  fillList("archiveList", archived, "no", t("empty.archive"));
  document.getElementById("savedCount").textContent = saved.length ? "(" + saved.length + ")" : "";
  document.getElementById("archiveCount").textContent = archived.length ? "(" + archived.length + ")" : "";
  var sb = document.getElementById("savedBadge");
  sb.hidden = !saved.length;
  sb.textContent = saved.length;

  var actions = document.getElementById("actions");
  actions.hidden = view !== "discover" || !q.length;
  document.getElementById("btnNo").disabled = !q.length;
  document.getElementById("btnYes").disabled = !q.length;
  document.getElementById("btnUndo").disabled = !undoStack.length;
}

document.querySelectorAll(".ti").forEach(function (n) { n.innerHTML = ICONS[n.getAttribute("data-icon")]; });
document.getElementById("stampYes").innerHTML = ICONS.heart;
document.getElementById("stampNo").innerHTML = ICONS.x;

// Fill in every translatable label for the current language.
function applyStatic() {
  document.documentElement.lang = lang;
  document.getElementById("asOf").textContent = t("asOf", fmtListed(AS_OF));
  document.querySelectorAll("[data-i18n]").forEach(function (n) { n.textContent = t(n.getAttribute("data-i18n")); });
  chipRegistry.forEach(function (c) { c.b.textContent = t(c.labelKey); });
  [["btnNo", "x", "aria.no"], ["btnUndo", "undo", "aria.undo"], ["btnYes", "heart", "aria.yes"]].forEach(function (b) {
    var node = document.getElementById(b[0]);
    node.innerHTML = ICONS[b[1]];
    node.setAttribute("aria-label", t(b[2]));
    node.title = t(b[2]);
  });
  document.querySelectorAll("[data-lang-toggle]").forEach(function (n) {
    n.textContent = t("langBtn");
    n.setAttribute("aria-label", t("langAria"));
  });
}

function setLang(next) {
  lang = next;
  try { localStorage.setItem("rental-lang-v1", lang); } catch (e) {}
  applyStatic();
  greet();
  shownId = null;
  render();
  if (detailFor) { var l = detailFor, m = detailMode; closeDetail(); openDetail(l, m); }
}
document.querySelectorAll("[data-lang-toggle]").forEach(function (n) {
  n.addEventListener("click", function () { setLang(lang === "ja" ? "en" : "ja"); });
});

document.getElementById("btnYes").addEventListener("click", function () { if (queue[0]) decide(queue[0], "yes", document.querySelector("#deck .profile")); });
document.getElementById("btnNo").addEventListener("click", function () { if (queue[0]) decide(queue[0], "no", document.querySelector("#deck .profile")); });
document.getElementById("btnUndo").addEventListener("click", undo);
document.getElementById("detailBack").addEventListener("click", closeDetail);
document.getElementById("tabDiscover").addEventListener("click", function () { setView("discover"); });
document.getElementById("tabSaved").addEventListener("click", function () { setView("saved"); });
document.getElementById("tabEmailed").addEventListener("click", function () { setView("emailed"); });
document.getElementById("tabArchive").addEventListener("click", function () { setView("archive"); });

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && filtersOpen()) { closeFilters(); return; }
  if (e.key === "Escape" && detailFor) { closeDetail(); return; }
  var tag = (document.activeElement && document.activeElement.tagName) || "";
  if (detailFor || filtersOpen() || view !== "discover" || tag === "SELECT" || tag === "INPUT") return;
  if (!queue[0]) return;
  if (e.key === "ArrowRight") decide(queue[0], "yes", document.querySelector("#deck .profile"));
  else if (e.key === "ArrowLeft") decide(queue[0], "no", document.querySelector("#deck .profile"));
});

applyStatic();
greet();
syncChips();
render();

</script>
</body>
</html>
